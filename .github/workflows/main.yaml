name: Build and Deploy chatbot
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy Chat bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the chatbot
        run: npm run build

